rules:
  # ============ Adblock & Tracking ============
  - RULE-SET,BlockAds,🛑 Iklan
  # ============ Streaming ============
  - RULE-SET,Stream,📺 Streaming
  - GEOSITE,netflix,📺 Streaming
  - GEOSITE,youtube,📺 Streaming
  - GEOSITE,spotify,📺 Streaming

  # ============ Game ============
  - RULE-SET,Game,🎮 Game
  - GEOSITE,steam,🎮 Game
  - GEOSITE,epicgames,🎮 Game
  - GEOSITE,xbox,🎮 Game
  - GEOSITE,playstation,🎮 Game

  # ============ Sosmed ============
  - RULE-SET,Sosmed,💬 Sosmed
  - GEOSITE,facebook,💬 Sosmed
  - GEOSITE,twitter,💬 Sosmed
  - GEOSITE,instagram,💬 Sosmed
  - GEOSITE,tiktok,💬 Sosmed
  # ============ Online Shop ============
  - RULE-SET,Olshop,Online Shop 🛒
  # ============ Banking ============
  - RULE-SET,Bank,MBanking 💲
  # ============ Torrent ============
  - GEOSITE,tracker,🧲 Torrent
  - GEOIP,PRIVATE,🧲 Torrent

  # ============ Bypass Lokal ============
  - GEOIP,CN,🧭 Default
  - GEOSITE,cn,🧭 Default
  - DOMAIN-SUFFIX,local,🧭 Default
  - DOMAIN,localhost,🧭 Default

  # ============ Default ============
  - MATCH,🧭 Default
